name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable Stackline release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Trusted publication
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: test "${{ inputs.tag }}" = "stackline-v$(node -p \"require('./package.json').version\")"
      - run: npm ci
      - run: npm run verify
      - run: npm publish --access public --provenance
